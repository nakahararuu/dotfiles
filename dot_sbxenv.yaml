# sbx env user defaults (~/.sbxenv.yaml): the "小・中規模の機能開発" sandbox from
# https://github.com/nakahararuu/sbx-kits/wiki, so that a bare `sbx env create`
# (create only) or `sbx env run` (create + attach) in a project builds it.
# Spec: https://docs.docker.com/ai/sandboxes/configuration/environment-files/
#
# Prerequisites (host, once):
# - sbx v0.49.1+ (git-ssh-sign's ssh-agent@1 capability needs v0.48.0, and
#   v0.49.1 keeps kit-granted SSH-agent access working across a daemon restart)
# - allow the ghcr.io kit source (this replaces the whole allowlist):
#     sbx settings set kit.allowedSources '["docker.io/","ghcr.io/nakahararuu/"]'
# - git-ssh-sign: SSH agent forwarding on (`sbx settings get
#   ssh.agentForwardingEnabled` is true; `sbx daemon restart` after changing it).
#   The kit signs with a key from the forwarded agent (one registered as a
#   GitHub signing key if any, else the first), which the `initialize`
#   lifecycle command below loads into the host agent. Lifecycle commands need
#   approval on every run unless `sbx settings set env.rememberHostCommands true`.
# - Slack / Google Workspace MCP (optional; `postCreate` below skips any that
#   aren't registered). Neither supports Dynamic Client Registration, so they
#   are registered once on the host with a pre-registered OAuth client instead
#   of in `mcp.servers` (which can't carry a client id):
#     # Slack: the public client id Slack documents for Claude Code
#     # (https://docs.slack.dev/ai/slack-mcp-server/connect-to-harnesses).
#     # The workspace admin must have approved the MCP integration.
#     sbx mcp add slack --url https://mcp.slack.com/mcp \
#       --client-id 1601185624273.8899143856786 --callback-port 3118
#     # Google Workspace (Developer Preview): create a "Desktop app" OAuth
#     # client with "Use this client for an AI-powered agent" checked
#     # (https://developers.google.com/workspace/guides/configure-mcp-servers),
#     # then for each server below:
#     sbx secret set mcp:google-gmail:client_secret
#     sbx mcp add google-gmail --url https://gmailmcp.googleapis.com/mcp/v1 \
#       --client-id <CLIENT_ID>
#   Google servers (name -> URL): google-gmail -> gmailmcp,
#   google-calendar -> calendarmcp, google-drive -> drivemcp,
#   google-docs -> docsmcp, google-sheets -> sheetsmcp,
#   google-slides -> slidesmcp, google-workspace -> workspacemcp
#   (all https://<host>.googleapis.com/mcp/v1; google-workspace is Universal
#   Search across Gmail/Drive/Calendar/Chat).
#
# Notes:
# - The sandbox is named sbx-kit-claude-<directory> (user defaults can't set
#   `name`); pass --name to override.
# - Clone mode needs the project directory to be a Git repository (and not a
#   linked worktree). Use `sbx env create --clone=false` elsewhere.
# - Kit changes (e.g. a newer image) only apply to newly created sandboxes:
#   `sbx env rm` then `sbx env create`.
# - A project-level sbxenv.yaml is merged on top (scalars override, lists such
#   as `kits` concatenate), so it must also use v3 kits only.
# - Passing a path (`sbx env create <path>`) skips this file.
schemaVersion: "1"

# v3 kits only compose onto a v3 workload; the built-in `claude` agent name
# selects v2 kits. `agent` is the last path component of the workload image.
agent: sbx-kit-claude

# User defaults may only point the workspace at the project directory (or a
# subdirectory). `clone: true` matches the wiki's `sbx create --clone`.
workspace:
  path: ${{ env.projectDir }}
  clone: true

# Sandbox-wide environment variables. The neovim kit only exports EDITOR/VISUAL
# from /etc/profile.d (login shells), which Claude Code's process never reads,
# so Ctrl+G would not open an external editor without this.
env:
  EDITOR: nvim
  VISUAL: nvim

# Host commands run before every `sbx env create`/`run`. Load SSH keys into the
# host agent ($SSH_AUTH_SOCK): the git-ssh-sign signing key when git's
# `user.signingkey` is set (biz), otherwise ssh-add's default keys.
# Needs an agent in the calling shell: a macOS GUI terminal has one, a shell
# logged in over SSH usually doesn't. There, point SSH_AUTH_SOCK at an agent
# first (the sandbox is forwarded this same agent unless the
# ssh.agentSocketPath setting says otherwise); --skip-host-commands gets past
# this step, but git-ssh-sign commits then fail without a key.
# `sh -c` because the command runs in the user's shell (fish).
lifecycle:
  initialize:
    - name: Load SSH keys
      timeout: 1m
      command: sh -c 'k=$(git config --type=path --get user.signingkey); ssh-add -q ${k:+"$k"}'
  # Attach the host-registered Slack / Google Workspace MCP servers (see
  # Prerequisites) to a newly created sandbox. They stay attached across
  # restarts; postCreate doesn't run when attaching to an existing sandbox.
  # A server that isn't registered on this host is skipped with a warning.
  postCreate:
    - name: Load Slack / Google Workspace MCP servers
      timeout: 3m
      command: >-
        sh -c 'for s in slack google-gmail google-calendar google-drive
        google-docs google-sheets google-slides google-workspace; do
        sbx mcp load "$s" --sandbox "$SBX_SANDBOX_NAME" ||
        echo "skipped MCP server $s (not registered on this host?)" >&2;
        done'

# MCP servers for the sandbox. A `url` (remote) server is registered host-wide
# and survives `sbx env rm`. When a project sbxenv.yaml declares a server with
# the same name, its entry wins. The schema has no transport/auth fields, so
# authentication (e.g. OAuth) is not configured in this file; servers that
# need a pre-registered OAuth client (Slack, Google Workspace) are registered
# on the host and attached by the `postCreate` lifecycle command instead.
mcp:
  servers:
    # AWS MCP Server (streamable HTTP, OAuth via AWS sign-in, ap-northeast-1).
    - name: aws
      url: https://aws-mcp.ap-northeast-1.api.aws/mcp

kits:
  # Every kit is pinned to a release tag (not `latest`) so a sandbox is
  # reproducible; bump a tag to update that kit (then recreate the sandbox).

  # The Claude Code workload.
  - docker.io/docker/sbx-kit-claude:2.1.314

  # docker/sbx-kits-contrib kits, as the prebuilt v3 images it publishes
  # (no need to build them from source).
  - docker.io/sbx/claude-sbx-statusline:1.0.0
  # Commits fail outright when the forwarded agent has no key, so this relies
  # on the `initialize` lifecycle command above.
  - docker.io/sbx/git-ssh-sign:1.0.3
  - docker.io/sbx/mise:2026.11.9-0
  - docker.io/sbx/neovim:0.12.5
  - docker.io/sbx/playwright:1.65.1-0

  # nakahararuu/sbx-kits kits, as the prebuilt v3 images its CI publishes from
  # main. Git references would make sbx build them on the host, which needs a
  # BuildKit with the OCI exporter (Docker Desktop's docker driver fails).
  - ghcr.io/nakahararuu/sbx-kits/claude-documentation:1.0.0
  - ghcr.io/nakahararuu/sbx-kits/claude-plugins-small-medium:1.0.0
  - ghcr.io/nakahararuu/sbx-kits/docker-amd64:1.0.0
  - ghcr.io/nakahararuu/sbx-kits/mise-runtimes:1.0.0
  - ghcr.io/nakahararuu/sbx-kits/nakahararuu-claude-plugins:1.0.1
