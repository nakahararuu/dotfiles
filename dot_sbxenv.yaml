# sbx env user defaults (~/.sbxenv.yaml): the "小・中規模の機能開発" sandbox from
# https://github.com/nakahararuu/sbx-kits/wiki, so that a bare `sbx env create`
# (create only) or `sbx env run` (create + attach) in a project builds it.
# Spec: https://docs.docker.com/ai/sandboxes/configuration/environment-files/
#
# Prerequisites (host, once):
# - sbx v0.49.1+ (git-ssh-sign's ssh-agent@1 capability needs v0.48.0, and
#   v0.49.1 keeps kit-granted SSH-agent access working across a daemon restart)
# - allow the ghcr.io kit source (this replaces the whole allowlist):
#     sbx settings set kit.allowedSources '["docker.io/","ghcr.io/nakahararuu/"]'
# - chrome-devtools-host: launch Chrome on the host with remote debugging, see
#   https://github.com/nakahararuu/sbx-kits/tree/main/chrome-devtools-host#readme
# - git-ssh-sign: SSH agent forwarding on (`sbx settings get
#   ssh.agentForwardingEnabled` is true; `sbx daemon restart` after changing it).
#   The kit signs with a key from the forwarded agent (one registered as a
#   GitHub signing key if any, else the first), which the `initialize`
#   lifecycle command below loads into the host agent. Lifecycle commands need
#   approval on every run unless `sbx settings set env.rememberHostCommands true`.
#
# Notes:
# - The sandbox is named sbx-kit-claude-<directory> (user defaults can't set
#   `name`); pass --name to override.
# - Clone mode needs the project directory to be a Git repository (and not a
#   linked worktree). Use `sbx env create --clone=false` elsewhere.
# - Kit changes (e.g. a newer image) only apply to newly created sandboxes:
#   `sbx env rm` then `sbx env create`.
# - A project-level sbxenv.yaml is merged on top (scalars override, lists such
#   as `kits` concatenate), so it must also use v3 kits only.
# - Passing a path (`sbx env create <path>`) skips this file.
schemaVersion: "1"

# v3 kits only compose onto a v3 workload; the built-in `claude` agent name
# selects v2 kits. `agent` is the last path component of the workload image.
agent: sbx-kit-claude

# User defaults may only point the workspace at the project directory (or a
# subdirectory). `clone: true` matches the wiki's `sbx create --clone`.
workspace:
  path: ${{ env.projectDir }}
  clone: true

# Sandbox-wide environment variables. The neovim kit only exports EDITOR/VISUAL
# from /etc/profile.d (login shells), which Claude Code's process never reads,
# so Ctrl+G would not open an external editor without this.
env:
  EDITOR: nvim
  VISUAL: nvim

# Host commands run before every `sbx env create`/`run`. Load SSH keys into the
# host agent: the git-ssh-sign signing key when git's `user.signingkey` is set
# (biz), otherwise ssh-add's default keys.
# A shell logged in over SSH has no SSH_AUTH_SOCK (launchd only sets it for the
# GUI session), so also try launchd's sockets, using the first one where
# `ssh-add -l` reaches an ssh-agent (exit 0, or 1 with "no identities").
# `sh -c` because the command runs in the user's shell (fish).
lifecycle:
  initialize:
    - name: Load SSH keys
      timeout: 1m
      command: |
        sh -c '
          key=$(git config --type=path --get user.signingkey)
          for s in "$SSH_AUTH_SOCK" /var/run/com.apple.launchd.*/Listeners; do
            out=$(SSH_AUTH_SOCK=$s ssh-add -l 2>&1) ||
              [ "$out" = "The agent has no identities." ] || continue
            SSH_AUTH_SOCK=$s ssh-add -q ${key:+"$key"} && exit
            echo "ssh-add failed; does the key file exist?" >&2; exit 1
          done
          echo "no ssh-agent found" >&2; exit 1
        '

kits:
  # The Claude Code workload. Bump the tag to update Claude Code.
  - docker.io/docker/sbx-kit-claude:2.1.267

  # docker/sbx-kits-contrib kits, as the prebuilt v3 images it publishes
  # (no need to build them from source).
  - docker.io/sbx/claude-sbx-statusline:latest
  # Commits fail outright when the forwarded agent has no key, so this relies
  # on the `initialize` lifecycle command above.
  - docker.io/sbx/git-ssh-sign:latest
  - docker.io/sbx/mise:latest
  - docker.io/sbx/neovim:latest
  - docker.io/sbx/playwright:latest

  # nakahararuu/sbx-kits kits, as the prebuilt v3 images its CI publishes from
  # main. Git references would make sbx build them on the host, which needs a
  # BuildKit with the OCI exporter (Docker Desktop's docker driver fails).
  - ghcr.io/nakahararuu/sbx-kits/chrome-devtools-host:latest
  - ghcr.io/nakahararuu/sbx-kits/claude-documentation:latest
  - ghcr.io/nakahararuu/sbx-kits/claude-plugins-small-medium:latest
  - ghcr.io/nakahararuu/sbx-kits/docker-amd64:latest
  - ghcr.io/nakahararuu/sbx-kits/mise-runtimes:latest
  - ghcr.io/nakahararuu/sbx-kits/nakahararuu-claude-plugins:latest
