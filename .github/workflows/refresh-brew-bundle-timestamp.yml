name: RefreshBrewBundleTimestamp

# 1週間に1回はパッケージの更新がトリガーされるようにする。
# bizBrewfile / privateBrewfile 内の `# brew-bundle-last-refresh:` コメントを更新する。

on:
  schedule:
    - cron: "0 0 * * 1" # 毎週月曜 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-timestamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Brewfile timestamp comments
        run: |
          set -euo pipefail
          TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for f in bizBrewfile privateBrewfile; do
            sed -i "s/^# brew-bundle-last-refresh:.*/# brew-bundle-last-refresh: ${TIMESTAMP}/" "$f"
          done

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- bizBrewfile privateBrewfile; then
            git add bizBrewfile privateBrewfile
            git commit -m "chore: weekly brew bundle refresh timestamp"
            git push
          else
            echo "No changes to commit"
          fi
